[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nilavu"
version = "0.1.0"
description = "A seeded terminal landscape game and source viewer with interactive lighting."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=8.2.8,<9"]

[project.scripts]
nilavu = "nilavu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
